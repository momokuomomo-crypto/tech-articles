# drafts/ を編集したら、Qiita 用と Zenn 用のファイルを自動生成して push する。
# これがないと npm run sync を手で実行するまで反映されない。
name: Sync articles

on:
  push:
    branches: [main]
    paths:
      - "drafts/**"
      - "articles.config.json"
      - "scripts/sync-articles.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 生成
        run: node scripts/sync-articles.mjs

      # public/ と articles/ は上の paths に含まれないため、
      # このコミットがワークフローを再起動することはない
      - name: 差分があれば commit
        run: |
          if git diff --quiet -- public articles; then
            echo "差分なし。何もしない"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public articles
          git commit -m "drafts の変更を public/ と articles/ へ反映"
          git push
